<!doctype html>
<html><head>
<meta charset="UTF-8">
<title>Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Satisfy&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
    * {
        margin: 0;
        padding: 0;
    }

    @font-face {
        font-family: Candara;
        src: url("Candara.ttf");
    }

    h1 {
        font: 72pt/1.4em "Bebas Neue";
        text-align: center;
        text-shadow: 2px 1px 2px orange;
        margin: 24px 0;
    }

    #textbox {
        width: 800px;
        height: auto;
        margin: 0 auto;
        background: whitesmoke;
        box-shadow: 2px 3px 6px gainsboro;
        border: 1px solid gainsboro;
    }

    .gallery {
        display: flex;
        justify-content: center;
        align-items: Center;
		
    }

    figure {
        width: 202px;
        margin: 24px;
    }

    .baby, .dsc, .front, .zoom {
        display: block;
        width: 200px;
        height: auto;
        border: 1px solid gray;
        box-shadow: 0px 0px 6px pink;
        transition: transform 0.5s;
    }

    figcaption {
        font: 14pt/1.3em
		"Helvetica", sans-serif;
        margin-top: 6px;
        overflow-wrap: anywhere;
    }

    .zoom {
        background: url("thumb-tulip.jpg");
        background-size: 100%;
        background-position: center;
    }

    img:hover {
        transform: scale(1.05);
        transition: transform 0.5s;
    }

    .zoom:hover {
        background-size: 105%;
        transition: background-size 0.5s;
    }
</style>
</head>

<body>
    <h1>Portfolio</h1>

    <div id="textbox">
        <div class="gallery">
			<figure>
				<a href="hirono.png" target="_blank">
                <img class="front" src="hirono.png" alt="Hirono">
				</a>
				<figcaption>
                    Hirono
                </figcaption>
				
            </figure>
            <figure>
				<a href="spongebob.png" target="_blank">
                <img class="baby" src="spongebob.png" alt="Spongebob Plush">
				</a>
                <figcaption>
                   Bikini Bottom Buddies
                </figcaption>
            </figure>

            <figure>
				<a href="peachriot.png" target="_blank">
                <img class="dsc" src="peachriot.png" alt="Peach Riot">
				</a>
                <figcaption>
                    Peach Riot
                </figcaption>
            </figure>

            

        </div>
    </div>
</body>
</html>
